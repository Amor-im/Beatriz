<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wireframes v1 · Agenda Fácil</title>
  <link rel="stylesheet" href="wireframes.css">
</head>
<body>
  <header class="cabecalho-pagina">
    <h1>Wireframes v1 · Agenda Fácil</h1>
    <p>Primeira versão, ingênua de propósito: desenhada no jeito mais comum de app de agendamento para servir de base à avaliação heurística, que foi feita com um assistente de IA. A avaliação está em <a href="../avaliacao-heuristica.md">avaliacao-heuristica.md</a> e a versão corrigida em <a href="../prototipo/index.html">../prototipo/</a>.</p>
  </header>

  <main class="grade">

    <!-- W1 · Página do negócio -->
    <figure>
      <section class="frame celular" id="w1" aria-label="W1, página do negócio">
        <div class="wf-imagem" style="height:180px; margin:-20px -16px 0;"></div>
        <div class="wf-titulo">Barbearia Exemplo</div>
        <div class="wf-texto">Bem-vindo! Agende seu horário online de forma rápida e prática.</div>
        <div class="wf-botao">AGENDAR</div>
        <div class="wf-subtitulo">Nossos serviços</div>
        <ul class="wf-lista">
          <li>Corte</li>
          <li>Barba</li>
          <li>Corte + barba</li>
          <li>Sobrancelha</li>
        </ul>
        <div class="wf-subtitulo">Sobre nós</div>
        <div class="wf-barra"></div>
        <div class="wf-barra media"></div>
      </section>
      <figcaption>W1 · Página do negócio</figcaption>
    </figure>

    <!-- W2 · Serviço -->
    <figure>
      <section class="frame celular" id="w2" aria-label="W2, escolha do serviço">
        <div class="wf-pequeno">‹ voltar</div>
        <div class="wf-titulo">Escolha o serviço</div>
        <ul class="wf-lista">
          <li><span class="wf-radio"></span> Corte</li>
          <li><span class="wf-radio"></span> Barba</li>
          <li><span class="wf-radio"></span> Corte + barba</li>
          <li><span class="wf-radio"></span> Sobrancelha</li>
        </ul>
        <div class="wf-botao rodape">Próximo</div>
      </section>
      <figcaption>W2 · Serviço</figcaption>
    </figure>

    <!-- W3 · Profissional -->
    <figure>
      <section class="frame celular" id="w3" aria-label="W3, escolha do profissional">
        <div class="wf-pequeno">‹ voltar</div>
        <div class="wf-titulo">Escolha o profissional</div>
        <ul class="wf-lista">
          <li><span class="wf-radio"></span><span class="wf-avatar wf-imagem"></span> Profissional 1</li>
          <li><span class="wf-radio"></span><span class="wf-avatar wf-imagem"></span> Profissional 2</li>
          <li><span class="wf-radio"></span><span class="wf-avatar wf-imagem"></span> Profissional 3</li>
        </ul>
        <div class="wf-botao rodape">Próximo</div>
      </section>
      <figcaption>W3 · Profissional</figcaption>
    </figure>

    <!-- W4 · Data -->
    <figure>
      <section class="frame celular" id="w4" aria-label="W4, escolha da data">
        <div class="wf-pequeno">‹ voltar</div>
        <div class="wf-titulo">Escolha a data</div>
        <div class="wf-subtitulo" style="text-align:center">‹ Outubro 2026 ›</div>
        <div class="wf-mes">
          <span class="cab">D</span><span class="cab">S</span><span class="cab">T</span><span class="cab">Q</span><span class="cab">Q</span><span class="cab">S</span><span class="cab">S</span>
          <span class="off"></span><span class="off"></span><span class="off"></span><span class="off"></span><span class="off">1</span><span class="off">2</span><span class="off">3</span>
          <span class="off">4</span><span class="off">5</span><span class="off">6</span><span class="off">7</span><span class="sel">8</span><span>9</span><span>10</span>
          <span class="off">11</span><span>12</span><span>13</span><span>14</span><span>15</span><span>16</span><span>17</span>
          <span class="off">18</span><span>19</span><span>20</span><span>21</span><span>22</span><span>23</span><span>24</span>
          <span class="off">25</span><span>26</span><span>27</span><span>28</span><span>29</span><span>30</span><span>31</span>
        </div>
        <div class="wf-botao rodape">Próximo</div>
      </section>
      <figcaption>W4 · Data</figcaption>
    </figure>

    <!-- W5 · Horário -->
    <figure>
      <section class="frame celular" id="w5" aria-label="W5, escolha do horário">
        <div class="wf-pequeno">‹ voltar</div>
        <div class="wf-titulo">Escolha o horário</div>
        <div class="wf-horas">
          <span class="off">08:00</span><span class="off">08:30</span><span>09:00</span><span class="off">09:30</span>
          <span class="off">10:00</span><span>10:30</span><span>11:00</span><span class="off">11:30</span>
          <span class="off">12:00</span><span class="off">12:30</span><span class="off">13:00</span><span>13:30</span>
          <span>14:00</span><span class="off">14:30</span><span class="off">15:00</span><span class="off">15:30</span>
          <span>16:00</span><span>16:30</span><span class="off">17:00</span><span class="off">17:30</span>
          <span class="off">18:00</span><span>18:30</span><span class="off">19:00</span><span class="off">19:30</span>
        </div>
        <div class="wf-botao rodape">Próximo</div>
      </section>
      <figcaption>W5 · Horário</figcaption>
    </figure>

    <!-- W6 · Dados -->
    <figure>
      <section class="frame celular" id="w6" aria-label="W6, dados do cliente">
        <div class="wf-pequeno">‹ voltar</div>
        <div class="wf-titulo">Seus dados</div>
        <div class="wf-alerta">Preencha os campos obrigatórios.</div>
        <div class="wf-campo">Nome completo *</div>
        <div class="wf-campo">E-mail *</div>
        <div class="wf-campo">WhatsApp *</div>
        <div class="wf-campo" style="height:80px">Observações</div>
        <div class="wf-check"><span></span> Li e aceito os termos de uso</div>
        <div class="wf-botao rodape">Enviar</div>
      </section>
      <figcaption>W6 · Dados</figcaption>
    </figure>

    <!-- W7 · Confirmação -->
    <figure>
      <section class="frame celular" id="w7" aria-label="W7, confirmação">
        <div style="height:220px"></div>
        <div class="wf-imagem" style="width:72px; height:72px; margin:0 auto; border-radius:50%"></div>
        <div class="wf-titulo" style="text-align:center">Agendamento realizado com sucesso!</div>
        <div class="wf-botao claro">Voltar ao início</div>
      </section>
      <figcaption>W7 · Confirmação</figcaption>
    </figure>

    <!-- W8 · Painel: agenda -->
    <figure>
      <section class="frame computador" id="w8" aria-label="W8, painel, agenda">
        <div class="wf-topo">
          <span class="logo wf-imagem"></span>
          <nav><b>Agenda</b><span>Clientes</span><span>Serviços</span><span>Relatórios</span><span>Configurações</span></nav>
        </div>
        <div class="wf-conteudo">
          <div class="wf-titulo">Agenda</div>
          <div class="wf-campo" style="width:200px">08/10/2026</div>
          <table class="wf-tabela">
            <thead><tr><th>Hora</th><th>Cliente</th><th>Serviço</th><th>Profissional</th><th></th><th></th></tr></thead>
            <tbody>
              <tr><td>09:00</td><td>Cliente 1</td><td>Corte</td><td>Profissional 1</td><td><span class="wf-ponto"></span></td><td><span class="wf-icone">✎</span><span class="wf-icone">🗑</span></td></tr>
              <tr><td>09:40</td><td>Cliente 2</td><td>Barba</td><td>Profissional 2</td><td><span class="wf-ponto claro"></span></td><td><span class="wf-icone">✎</span><span class="wf-icone">🗑</span></td></tr>
              <tr><td>10:30</td><td>Cliente 3</td><td>Corte + barba</td><td>Profissional 1</td><td><span class="wf-ponto"></span></td><td><span class="wf-icone">✎</span><span class="wf-icone">🗑</span></td></tr>
              <tr><td>11:00</td><td>Cliente 4</td><td>Corte</td><td>Profissional 2</td><td><span class="wf-ponto claro"></span></td><td><span class="wf-icone">✎</span><span class="wf-icone">🗑</span></td></tr>
              <tr><td>14:00</td><td>Cliente 5</td><td>Sobrancelha</td><td>Profissional 1</td><td><span class="wf-ponto"></span></td><td><span class="wf-icone">✎</span><span class="wf-icone">🗑</span></td></tr>
              <tr><td>15:30</td><td>Cliente 6</td><td>Corte</td><td>Profissional 2</td><td><span class="wf-ponto"></span></td><td><span class="wf-icone">✎</span><span class="wf-icone">🗑</span></td></tr>
            </tbody>
          </table>
        </div>
      </section>
      <figcaption>W8 · Painel: agenda</figcaption>
    </figure>

    <!-- W9 · Painel: cadastro -->
    <figure>
      <section class="frame computador" id="w9" aria-label="W9, painel, cadastro do negócio">
        <div class="wf-topo">
          <span class="logo wf-imagem"></span>
          <nav><span>Agenda</span><span>Clientes</span><span>Serviços</span><span>Relatórios</span><b>Configurações</b></nav>
        </div>
        <div class="wf-conteudo">
          <div class="wf-titulo">Configurar negócio</div>
          <div class="wf-colunas">
            <div>
              <div class="wf-subtitulo">Dados do negócio</div>
              <div class="wf-campo">Nome do negócio</div>
              <div class="wf-campo">CNPJ</div>
              <div class="wf-campo">Telefone</div>
              <div class="wf-campo">Endereço</div>
              <div class="wf-campo">E-mail</div>
              <div class="wf-campo">Senha</div>
            </div>
            <div>
              <div class="wf-subtitulo">Serviços</div>
              <div class="wf-linha-form"><span>Nome</span><span>Duração</span><span>Preço</span></div>
              <div class="wf-linha-form"><span class="wf-campo"></span><span class="wf-campo"></span><span class="wf-campo"></span></div>
              <div class="wf-linha-form"><span class="wf-campo"></span><span class="wf-campo"></span><span class="wf-campo"></span></div>
              <div class="wf-linha-form"><span class="wf-campo"></span><span class="wf-campo"></span><span class="wf-campo"></span></div>
              <div class="wf-pequeno">+ adicionar serviço</div>
              <div class="wf-subtitulo">Profissionais</div>
              <div class="wf-campo"></div>
              <div class="wf-campo"></div>
            </div>
            <div>
              <div class="wf-subtitulo">Horários</div>
              <div class="wf-linha-form"><span>Segunda</span><span class="wf-campo"></span><span class="wf-campo"></span></div>
              <div class="wf-linha-form"><span>Terça</span><span class="wf-campo"></span><span class="wf-campo"></span></div>
              <div class="wf-linha-form"><span>Quarta</span><span class="wf-campo"></span><span class="wf-campo"></span></div>
              <div class="wf-linha-form"><span>Quinta</span><span class="wf-campo"></span><span class="wf-campo"></span></div>
              <div class="wf-linha-form"><span>Sexta</span><span class="wf-campo"></span><span class="wf-campo"></span></div>
              <div class="wf-linha-form"><span>Sábado</span><span class="wf-campo"></span><span class="wf-campo"></span></div>
              <div class="wf-linha-form"><span>Domingo</span><span class="wf-campo"></span><span class="wf-campo"></span></div>
            </div>
          </div>
          <div class="wf-botao" style="width:200px">Salvar</div>
        </div>
      </section>
      <figcaption>W9 · Painel: cadastro</figcaption>
    </figure>

  </main>
</body>
</html>
