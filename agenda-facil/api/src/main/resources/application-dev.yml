# Perfil de desenvolvimento: carrega o negócio de exemplo (Studio Exemplo) para a demonstração.
# Uso: ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev
logging:
  level:
    com.agendafacil: DEBUG

app:
  limites:
    # no computador de desenvolvimento os testes de ponta a ponta marcam vários horários seguidos
    agendamentos-por-ip: 100
