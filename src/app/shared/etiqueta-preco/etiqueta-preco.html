@if (promo()) {
  <span class="antes">
    <span class="apenas-leitor">De </span>
    <s>{{ preco() | currency }}</s>
    <span class="selo-desconto">-{{ desconto }}%</span>
  </span>
  <span class="etiqueta">
    <span class="apenas-leitor">por </span>
    {{ preco() | desconto: desconto | currency }}
  </span>
} @else {
  <span class="etiqueta">{{ preco() | currency }}</span>
}
