<article class="card" [class.card--esgotado]="esgotado()">
  <div class="card__foto">
    <img [ngSrc]="imagem()" fill sizes="(min-width: 1100px) 25vw, (min-width: 768px) 33vw, 50vw" [priority]="prioridade()" alt="" appImagemReserva />
    @if (esgotado()) {
      <span class="card__selo card__selo--esgotado">Esgotado</span>
    } @else if (produto().promo) {
      <span class="card__selo card__selo--promo">Promoção</span>
    } @else if (produto().estado === 'novo') {
      <span class="card__selo">Novidade</span>
    }
  </div>

  <div class="card__info">
    <p class="sobretitulo">{{ categoria() }}</p>
    <h3 class="card__nome" [attr.lang]="previa() ? null : 'en'">
      @if (previa()) {
        {{ produto().nome || 'Nome do produto' }}
      } @else {
        <a class="card__link" [routerLink]="['/produtos', produto().id]">{{ produto().nome }}</a>
      }
    </h3>
    <app-etiqueta-preco class="card__preco" [preco]="produto().preco" [promo]="produto().promo" />

    <button
      type="button"
      class="botao botao--primario botao--largo card__botao"
      [disabled]="esgotado() || previa()"
      [attr.aria-label]="esgotado() ? null : 'Adicionar ao carrinho: ' + produto().nome"
      (click)="onAdicionar()"
    >
      @if (esgotado()) {
        Esgotado
      } @else {
        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" />
        </svg>
        Adicionar
      }
    </button>
  </div>
</article>
